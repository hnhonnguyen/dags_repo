apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: osds-spark-app
  namespace: spark-operator
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "docker.io/bitnami/spark:3.4.1"
  mainApplicationFile: local:///opt/spark/work-dir/scripts/basic_spark.py
  sparkVersion: "3.5.0"
  restartPolicy:
    type: Never
  driver:
    coreLimit: "1"
    coreRequest: "1m"
    memory: "512m"
    labels:
      version: "3.5.0"
    serviceAccount: spark
    volumeMounts:
      - name: "spark-local-dir-spark-scripts-volume"
        mountPath: "/opt/spark/work-dir/scripts"
  executor:
    coreLimit: "1"
    coreRequest: "1m"
    instances: 1
    memory: "512m"
    labels:
      version: "3.5.0"
    volumeMounts:
      - name: "spark-local-dir-spark-scripts-volume"
        mountPath: "/opt/spark/work-dir/scripts"
  volumes:
    - name: "spark-local-dir-spark-scripts-volume"
      hostPath:
        path: "/Users/hnhonnguyen/dev/dags_repo/pyspark_scripts"
        type: Directory