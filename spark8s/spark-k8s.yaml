apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: osds-spark-app
  namespace: spark-operator
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "docker.io/kubeflow/spark-operator:v1beta2-1.6.1-3.5.0"
  mainApplicationFile: local:///opt/airflow/dags/repo/pyspark/pyspark_scripts/basic_spark.py
  sparkVersion: "3.5.0"
  restartPolicy:
    type: Never
  driver:
    coreLimit: "1"
    coreRequest: "1m"
    memory: "512m"
    labels:
      version: "3.5.0"
    serviceAccount: spark-operator
    # volumeMounts:
    #   - name: "spark-local-dir-spark-scripts-volume"
    #     mountPath: "/opt/spark/work-dir/scripts"
  executor:
    # coreLimit: "1"
    coreRequest: "250m"
    instances: 2
    memory: "512m"
    labels:
      version: "3.5.0"
  #   volumeMounts:
  #     - name: "spark-local-dir-spark-scripts-volume"
  #       mountPath: "/opt/spark/work-dir/scripts"
  # volumes:
  #   - name: "spark-local-dir-spark-scripts-volume"
  #     hostPath:
  #       path: "/opt/airflow/dags/repo/pyspark/pyspark_scripts/"
  #       type: Directory