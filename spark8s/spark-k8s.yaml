apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: osds-spark-app
  namespace: spark-operator
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "apache/spark:3.5.0"
  mainApplicationFile: local:///mnt/spark/work/basic_spark.py
  sparkVersion: "3.5.0"
  restartPolicy:
    type: Never
  volumes:
    - name: scripts
      hostPath:
        path: /home/docker/dags_repo/pyspark/pyspark_scripts
        type: Directory
  driver:
    cores: 1
    memory: "512m"
    labels:
      version: "3.5.0"
    serviceAccount: spark-operator
    volumeMounts:
      - name: scripts
        mountPath: /mnt/spark/scripts
  executor:
    cores: 1
    instances: 4
    memory: "512m"
    labels:
      version: "3.5.0"
    volumeMounts:
      - name: scripts
        mountPath: /mnt/spark/scripts
  dynamicAllocation:
    enabled: true
    initialExecutors: 2
    minExecutors: 2
    maxExecutors: 10